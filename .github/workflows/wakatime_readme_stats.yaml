name: Work Stats Readme

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

jobs:
  update-readme:
    name: Update XP.track()
    runs-on: ubuntu-latest

    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}

          SECTION_NAME: xp_track

          SHOW_TITLE: true
          TIME_RANGE: last_30_days

          SHOW_TIME: true
          SHOW_TOTAL: true

          SHOW_UPDATED_DATE: true
          SHOW_PROJECTS: true
          SHOW_LANGUAGE: true

          LANG_COUNT: 10
          PROJECT_COUNT: 10

          BLOCKS: ░▒▓█
          CODE_LANG: txt

          COMMIT_MESSAGE: "docs: update XP.track()"
